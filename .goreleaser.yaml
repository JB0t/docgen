# GoReleaser: the release binaries (.github/workflows/release.yml) and the
# release-candidate / dev snapshots (.github/workflows/ci.yml).
version: 2

project_name: docgen

before:
  hooks:
    - go mod download

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/JB0t/docgen/cmd.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - USAGE.md
      - CHANGELOG.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  # Set by CI: X.Y.Z-rc.N on a release branch, <last>-dev.N+<commit> on a manual run.
  version_template: "{{ .Env.BUILD_VERSION }}"

# Release notes come from the CHANGELOG.md section (--release-notes).
changelog:
  disable: true

release:
  name_template: "{{ .ProjectName }} v{{ .Version }}"
  prerelease: auto
