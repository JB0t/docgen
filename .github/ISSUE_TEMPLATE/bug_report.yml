name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `docgen --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: linux/amd64
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The command you ran and its output. Remove tokens, URLs and anything private.
    validations:
      required: true
