name: CI

# Pull requests (any base) and pushes to the long-lived branches run the tests.
# A push to release/X.Y.Z also builds the release candidate X.Y.Z-rc.N, and a
# manual run (Actions > CI > Run workflow) builds a dev snapshot of any branch.
# Both are workflow artifacts for testing; neither is published.
#
# The jobs "test" and "release-gate" are required checks: main needs both, dev
# needs "test" (scripts/setup-github.sh sets the rulesets).

on:
  pull_request:
  push:
    branches: [dev, main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A newer push cancels the older run, except on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted (run: gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "::error::go.mod/go.sum are not tidy (run: go mod tidy)"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: contrib tests
        run: bash contrib/tests/docgen-job-test
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null .
          done

  # Only release/* branches of this repository may merge into main. Every other
  # pull request passes this check, so it can be required on main without
  # blocking anything else.
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Only release branches merge into main
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$BASE" != main ]; then
            echo "Not a pull request into main - nothing to gate."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Pull requests into main come only from this repository's release branches. Open it against dev instead."
            exit 1
          fi
          if ! [[ "$HEAD" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only release/X.Y.Z branches merge into main (cut one with scripts/release.sh). Open this pull request against dev instead."
            exit 1
          fi
          echo "$HEAD may merge into main."

  # Release candidate: X.Y.Z-rc.N, where N counts the commits on the release
  # branch from its "chore(release): X.Y.Z" commit (1 for that commit itself).
  # Dev snapshot (manual run): <last release>-dev.<run number>+<commit>.
  snapshot:
    needs: test
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        env:
          REF: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [[ "$REF" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            v="${BASH_REMATCH[1]}"
            rc="$(git log --first-parent --format=%H -1 --grep="^chore(release): ${v}\$" HEAD)"
            [ -n "$rc" ] || { echo "::error::no 'chore(release): ${v}' commit on ${REF}"; exit 1; }
            n="$(git rev-list --count --first-parent "${rc}^..HEAD")"
            version="${v}-rc.${n}"
          else
            last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
            version="${last#v}-dev.${RUN}+$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.version.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 30
